<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Listening Examination - Trạm IELTS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="css-l/listening.css">

  <style>
    /* ========================================================
       BỐ CỤC CHUẨN THI IELTS DUOLINGO 3D
       ======================================================== */
    body.listening-test:not(.submitted) #passageBox { display: none !important; }
    body.listening-test:not(.submitted) #dragResizer { display: none !important; }
    body.listening-test:not(.submitted) #questionBox {
      width: 100% !important;
      max-width: 1250px;
      margin: 0 auto;
      padding: 24px 28px;
      background: #FFFFFF;
      border-radius: 22px;
      border: 2.5px solid var(--border-color);
      border-bottom: 5.5px solid var(--border-shadow);
    }

    body.listening-test.submitted #mainContainer {
      display: flex !important;
      flex-direction: row !important;
      height: calc(100vh - 130px) !important;
      overflow: hidden !important;
      gap: 0 !important;
    }
    body.listening-test.submitted #passageBox {
      display: block !important;
      width: 45%;
      min-width: 280px;
      max-width: 70%;
      height: 100% !important;
      overflow-y: auto !important;
      padding: 24px 28px;
      background: #FFFFFF;
      border-right: 2px solid var(--border-color);
    }
    body.listening-test.submitted #dragResizer {
      display: flex !important;
      width: 12px;
      background: #E8E2D8;
      cursor: col-resize;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.2s;
      z-index: 50;
      flex-shrink: 0;
    }
    body.listening-test.submitted #dragResizer:hover,
    body.listening-test.submitted #dragResizer.resizing {
      background: #0284C7;
    }
    body.listening-test.submitted #dragResizer .resizer-icon {
      font-size: 11px;
      color: #64748B;
      pointer-events: none;
    }
    body.listening-test.submitted #questionBox {
      flex: 1;
      min-width: 340px;
      height: 100% !important;
      overflow-y: auto !important;
      padding: 24px 28px;
      background: #FFFFFF;
      border-radius: 0;
      border: none;
    }

    .gdocs-exam-wrapper {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      position: relative;
      width: 100%;
    }
    .gdocs-paper-col { flex: 1; min-width: 0; }
    .gdocs-comments-col {
      width: 330px;
      flex-shrink: 0;
      position: sticky;
      top: 15px;
      max-height: calc(100vh - 160px);
      overflow-y: auto;
      padding-right: 4px;
      border-left: 2px solid var(--border-color);
      padding-left: 16px;
    }
    @media (max-width: 950px) {
      .gdocs-exam-wrapper { flex-direction: column; }
      .gdocs-comments-col { width: 100%; position: static; max-height: none; border-left: none; padding-left: 0; margin-top: 24px; }
    }

    .gdocs-comments-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border-color);
    }
    .gdocs-header-title { font-size: 14.5px; font-weight: 900; color: var(--text-main); }
    .btn-gdocs-toggle-all {
      background: #FFFFFF;
      color: var(--text-main);
      border: 1.5px solid var(--border-color);
      border-bottom: 3px solid var(--border-shadow);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .gdocs-comment-bubble {
      background: #FFFFFF;
      border: 2px solid var(--border-color);
      border-bottom: 3.5px solid var(--border-shadow);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      transition: all 0.15s ease;
    }
    .gdocs-comment-bubble.is-active { border-color: #0284C7; background: #F0F9FF; }
    .gdocs-bubble-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .gdocs-bubble-badge { font-size: 12px; font-weight: 900; background: #E0F2FE; color: #0284C7; padding: 2px 8px; border-radius: 6px; }
    .gdocs-bubble-preview { font-size: 12px; color: var(--text-muted); margin-left: 6px; font-weight: 700; }
    .gdocs-comment-bubble.is-collapsed .gdocs-bubble-body { display: none; }

    .gdocs-bubble-body { margin-top: 10px; padding-top: 10px; border-top: 1.5px dashed var(--border-color); }
    .inline-thought-box { margin-bottom: 10px; padding: 8px 12px; background: #F0FDF4; border: 1.5px solid #86EFAC; border-radius: 10px; }
    .inline-thought-box label { font-size: 12px; font-weight: 800; color: #166534; display: block; margin-bottom: 4px; }
    .inline-thought-box textarea { width: 100%; height: 40px; padding: 6px 10px; font-size: 13px; border: 1.5px solid #CBD5E1; border-radius: 8px; outline: none; resize: vertical; }

    .ai-assistant-box { padding: 8px 12px; background: #FFFFFF; border: 1.5px solid #BAE6FD; border-radius: 10px; }
    .ai-assistant-box label { font-size: 12px; font-weight: 800; color: #0369A1; display: block; margin-bottom: 4px; }
    .ai-input-group { display: flex; gap: 6px; }
    .ai-input-group input { flex: 1; padding: 6px 10px; font-size: 13px; border: 1.5px solid #CBD5E1; border-radius: 8px; outline: none; }
    .ai-btn { background: #0284C7; color: white; border: none; border-bottom: 3px solid #075985; padding: 6px 12px; border-radius: 8px; font-weight: 900; font-size: 12px; cursor: pointer; }
    .btn-comment-anchor { background: #FFFFFF; color: #0369A1; border: 1.5px solid var(--border-color); border-bottom: 3px solid var(--border-shadow); padding: 3px 8px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; margin-left: 6px; }

    .section-title { font-size: 18px; font-weight: 900; color: var(--text-main); margin: 22px 0 10px 0; border-left: 5px solid #0284C7; padding-left: 12px; }
    .instructions-box { background: #FAF7F2; border: 2px solid var(--border-color); border-radius: 14px; padding: 12px 18px; font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 18px; }
    .btn-audio-pill { background: #FFFFFF; color: #0369A1; border: 1.5px solid #BAE6FD; border-bottom: 3px solid #7DD3FC; padding: 4px 10px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; margin-left: 6px; }

    .mcq-options-list { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
    .mcq-option-item {
      display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px;
      border: 2px solid var(--border-color); border-bottom: 4px solid var(--border-shadow);
      border-radius: 14px; background: #FFFFFF; cursor: pointer; transition: all 0.08s ease;
    }
    .mcq-option-item:hover { background: #FAF7F2; }
    .mcq-option-item.selected { border-color: #0284C7; border-bottom-color: #075985; background: #F0F9FF; }
    .mcq-badge { font-weight: 900; color: #0284C7; background: #E0F2FE; padding: 3px 8px; border-radius: 6px; font-size: 13px; }
    .mcq-option-item.selected .mcq-badge { background: #0284C7; color: #FFFFFF; }

    .fill-input {
      font-family: inherit; font-size: 15px; font-weight: 800; color: #0284C7; background: #FFFFFF;
      border: 2px solid #CBD5E1; border-bottom: 3.5px solid #94A3B8; border-radius: 10px;
      padding: 6px 12px; text-align: center; outline: none; margin: 0 4px;
    }
    .fill-input:focus { border-color: #0284C7; background: #F0F9FF; }

    .btn-submit {
      background: var(--duo-green); color: #FFFFFF !important; border: none; border-bottom: 5px solid var(--duo-green-shadow);
      padding: 14px 24px; font-size: 16px; font-weight: 900; border-radius: 16px; width: 100%; cursor: pointer;
      margin-top: 24px; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.08s ease;
    }
    .btn-submit:active { transform: translateY(3px); border-bottom-width: 2px; }

    .btn-full-submit {
      margin-top: 14px; background: linear-gradient(135deg, #4F46E5 0%, #3730A3 100%); color: #FFFFFF !important;
      border: none; border-bottom: 5px solid #1E1B4B; padding: 15px 24px; border-radius: 16px; width: 100%;
      font-size: 16px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: all 0.08s ease;
    }
    .btn-full-submit:active { transform: translateY(3px); border-bottom-width: 2px; }
  </style>
</head>
<body class="listening-test">

<div class="user-info-box" style="background:#FFFFFF; border:2px solid var(--border-color); border-bottom:4px solid var(--border-shadow); border-radius:18px; padding:14px 20px; max-width:1250px; margin:16px auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
  <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center;">
    <div style="display:flex; align-items:center; gap:6px;">
      <b style="font-size:13.5px;">Họ và Tên:</b>
      <input type="text" id="studentNameInput" placeholder="Đang đồng bộ..." style="padding:6px 12px; border:1.5px solid var(--border-color); border-radius:8px; font-weight:700; font-size:13.5px;">
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <b style="font-size:13.5px;">Email Google:</b>
      <input type="email" id="studentEmailInput" placeholder="Đang đồng bộ..." style="padding:6px 12px; border:1.5px solid var(--border-color); border-radius:8px; font-weight:700; font-size:13.5px;">
    </div>
  </div>

  <div style="display:flex; align-items:center; gap:10px;">
    <a href="listening.html" class="btn-3d btn-3d-white" style="padding:8px 16px; font-size:13px;">← Danh mục Đề</a>
    <a href="../index.html" class="btn-3d btn-3d-white" style="padding:8px 16px; font-size:13px;">Trang chủ</a>
  </div>
</div>

<div class="header-bar" style="background:#FFFFFF; border:2px solid var(--border-color); border-bottom:4px solid var(--border-shadow); border-radius:18px; padding:14px 22px; max-width:1250px; margin:0 auto 20px auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
  <h1 id="testTitleHeader" style="margin:0; font-size:20px; font-weight:900; color:var(--lis-blue);">IELTS Listening Test</h1>
  
  <div style="display:flex; align-items:center; gap:10px;">
    <div style="display:flex; align-items:center; gap:6px; background:#FAF7F2; padding:6px 12px; border-radius:12px; border:1.5px solid var(--border-color); font-weight:800; font-size:13.5px;">
      <span>Thời gian:</span>
      <span id="timerDisplay" style="color:#D97706; font-size:15px;">00:00</span>
      <button type="button" onclick="window.startTimer && window.startTimer()" style="background:#22C55E; color:white; border:none; padding:4px 8px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px;">▶ Bắt đầu</button>
      <button type="button" onclick="window.pauseTimer && window.pauseTimer()" style="background:#F59E0B; color:white; border:none; padding:4px 8px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px;">⏸ Tạm dừng</button>
    </div>

    <div id="scoreBadge" style="display:none; background:#DCFCE7; color:#166534; border:1.5px solid #86EFAC; padding:6px 14px; border-radius:12px; font-weight:900; font-size:14px;">
      Điểm số: <span id="scoreText">0/10</span>
    </div>
  </div>
</div>

<div class="audio-player-container" id="audioPlayerWrapper" style="display: none; max-width:1250px; margin:0 auto 20px auto;">
  <audio id="mainAudioElement" class="audio-player-element" controls preload="auto"></audio>
</div>

<div class="container" id="mainContainer">
  <div class="passage-box" id="passageBox"></div>
  <div class="resizer" id="dragResizer"><div class="resizer-icon">◄►</div></div>
  <div class="question-box" id="questionBox">
    <div style="text-align:center; padding: 40px; color: var(--text-muted); font-weight: 800; font-size: 15px;">
      ⏳ Đang tải nội dung phần thi Nghe...
    </div>
  </div>
</div>

<div id="fullScoreModal" class="modal-backdrop">
  <div class="modal-content">
    <div style="background:#0F172A; color:white; padding:18px 22px; display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin: 0; font-size: 17px; font-weight:900;">BẢNG TỔNG KẾT ĐIỂM THI IELTS LISTENING (40 CÂU)</h3>
      <button onclick="document.getElementById('fullScoreModal').classList.remove('is-active')" style="background:transparent; border:none; color:white; font-size:24px; cursor:pointer; font-weight:900;">&times;</button>
    </div>
    <div class="modal-body" id="fullScoreModalBody" style="padding:22px; overflow-y:auto;"></div>
  </div>
</div>

<script>
  /* AUTO-SAVE VÀ ĐIỀU HƯỚNG GHI CHÚ */
  window.saveThought = function(qId, val) {
    if (!window.CURRENT_BASE_TEST) return;
    try {
      const key = `ielts_thought_${window.CURRENT_BASE_TEST}`;
      const store = JSON.parse(localStorage.getItem(key) || '{}');
      store[qId] = val;
      localStorage.setItem(key, JSON.stringify(store));
      window.updateBubblePreview(qId, val);
    } catch(e) {}
  };

  window.saveAiDraft = function(qId, val) {
    if (!window.CURRENT_BASE_TEST) return;
    try {
      const key = `ielts_ai_${window.CURRENT_BASE_TEST}`;
      const store = JSON.parse(localStorage.getItem(key) || '{}');
      if (!store[qId]) store[qId] = {};
      store[qId].question = val;
      localStorage.setItem(key, JSON.stringify(store));
    } catch(e) {}
  };

  window.saveAiChat = function(qId, question, response) {
    if (!window.CURRENT_BASE_TEST) return;
    try {
      const key = `ielts_ai_${window.CURRENT_BASE_TEST}`;
      const store = JSON.parse(localStorage.getItem(key) || '{}');
      store[qId] = { question, response };
      localStorage.setItem(key, JSON.stringify(store));
    } catch(e) {}
  };

  window.restoreSavedUserData = function() {
    if (!window.CURRENT_BASE_TEST) return;
    try {
      const thoughtKey = `ielts_thought_${window.CURRENT_BASE_TEST}`;
      const thoughtStore = JSON.parse(localStorage.getItem(thoughtKey) || '{}');
      Object.entries(thoughtStore).forEach(([qId, text]) => {
        const el = document.getElementById(`${qId}_thought`);
        if (el && text) {
          el.value = text;
          window.updateBubblePreview(qId, text);
        }
      });
    } catch(e) {}

    try {
      const aiKey = `ielts_ai_${window.CURRENT_BASE_TEST}`;
      const aiStore = JSON.parse(localStorage.getItem(aiKey) || '{}');
      Object.entries(aiStore).forEach(([qId, item]) => {
        const askInp = document.getElementById(`ai_ask_${qId}`);
        const respEl = document.getElementById(`ai_response_${qId}`);
        if (askInp && item && item.question) askInp.value = item.question;
        if (respEl && item && item.response) {
          respEl.innerHTML = item.response;
          respEl.style.display = 'block';
        }
      });
    } catch(e) {}
  };

  function setupAiObserver() {
    const qBox = document.getElementById('questionBox');
    if (!qBox) return;
    const observer = new MutationObserver((mutations) => {
      mutations.forEach(m => {
        if (m.target && m.target.classList && m.target.classList.contains('ai-response')) {
          const qId = m.target.id.replace('ai_response_', '');
          const askInp = document.getElementById(`ai_ask_${qId}`);
          const qText = askInp ? askInp.value : '';
          const respText = m.target.innerHTML;
          if (respText && respText.trim()) {
            m.target.style.display = 'block';
            window.saveAiChat(qId, qText, respText);
          }
        }
      });
    });
    observer.observe(qBox, { childList: true, subtree: true, characterData: true });
  }

  window.activateCommentBubble = function(qId) {
    document.querySelectorAll('.gdocs-comment-bubble').forEach(b => b.classList.remove('is-active'));
    const target = document.getElementById(`bubble_${qId}`);
    if (target) {
      target.classList.add('is-active');
      target.classList.remove('is-collapsed');
      target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  };

  window.toggleSingleCommentBubble = function(qId, e) {
    if (e) e.stopPropagation();
    const target = document.getElementById(`bubble_${qId}`);
    if (target) {
      target.classList.toggle('is-collapsed');
    }
  };

  window.toggleAllCommentBubbles = function(shouldExpand) {
    document.querySelectorAll('.gdocs-comment-bubble').forEach(b => {
      if (shouldExpand) b.classList.remove('is-collapsed');
      else b.classList.add('is-collapsed');
    });
  };

  window.updateBubblePreview = function(qId, text) {
    const prev = document.getElementById(`bubble_prev_${qId}`);
    if (prev) {
      prev.innerText = text.trim() ? `• ${text.trim().substring(0, 18)}...` : '';
    }
  };

  (function() {
    window.seekAudioTo = function(seconds, highlightId) {
      const audio = document.getElementById('mainAudioElement');
      if (audio && seconds !== undefined && seconds !== null) {
        audio.currentTime = parseFloat(seconds);
        audio.play().catch(() => {});
      }
      if (highlightId && window.highlightText) {
        window.highlightText(highlightId);
      }
    };

    window.syncUserAnswer = function(qId, val) {
      if (val === undefined || val === null) return;
      var cleanVal = String(val).trim();

      if (window.CURRENT_BASE_TEST) {
        try {
          const storeKey = `ielts_ans_${window.CURRENT_BASE_TEST}`;
          const currentStore = JSON.parse(localStorage.getItem(storeKey) || '{}');
          currentStore[qId] = cleanVal;
          localStorage.setItem(storeKey, JSON.stringify(currentStore));
        } catch(e) {}
      }

      var textInputs = document.querySelectorAll(`input[id="${qId}_input"]`);
      textInputs.forEach(el => {
        if (el && el.value !== cleanVal) el.value = cleanVal;
      });

      var inputs = document.querySelectorAll(`input[name="${qId}"]`);
      inputs.forEach(rb => {
        var isMatch = rb.value.trim().toUpperCase() === cleanVal.toUpperCase();
        rb.checked = isMatch;
        var parentLabel = rb.closest('.mcq-option-item');
        if (parentLabel) {
          if (isMatch) parentLabel.classList.add('selected');
          else parentLabel.classList.remove('selected');
        }
      });
    };
  })();

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
  }

  /* KÉO - THẢ & NHẤP CHUỘT (CLICK-TO-PLACE) CHO FLOWCHART & MATCHING */
  window.draggedData = null;
  window.selectedOptionForPlacement = null;

  window.handleDragStart = function(e, key, text) {
    window.draggedData = { key, text };
    e.dataTransfer.setData('text/plain', JSON.stringify({ key, text }));
  };

  window.handleDragOver = function(e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
  };

  window.handleDragLeave = function(e) {
    e.currentTarget.classList.remove('drag-over');
  };

  window.handleDrop = function(e, qId) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    let data = window.draggedData;
    try {
      const raw = e.dataTransfer.getData('text/plain');
      if (raw) data = JSON.parse(raw);
    } catch(err) {}

    if (data && data.key) {
      window.placeAnswerIntoDropzone(qId, data.key, data.text);
    }
  };

  /* TÍNH NĂNG NHẤP CHUỘT CHỌN ĐÁP ÁN (CLICK-TO-PLACE) */
  window.selectOptionCard = function(key, text, el) {
    document.querySelectorAll('.matching-drag-card').forEach(c => c.classList.remove('is-selected-card'));
    if (window.selectedOptionForPlacement && window.selectedOptionForPlacement.key === key) {
      window.selectedOptionForPlacement = null;
    } else {
      window.selectedOptionForPlacement = { key, text };
      if (el) el.classList.add('is-selected-card');
    }
  };

  window.handleDropzoneClick = function(qId) {
    if (window.selectedOptionForPlacement) {
      window.placeAnswerIntoDropzone(qId, window.selectedOptionForPlacement.key, window.selectedOptionForPlacement.text);
      document.querySelectorAll('.matching-drag-card').forEach(c => c.classList.remove('is-selected-card'));
      window.selectedOptionForPlacement = null;
    }
  };

  window.placeAnswerIntoDropzone = function(qId, key, text) {
    window.syncUserAnswer(qId, key);
    const dz = document.getElementById(`dropzone_${qId}`);
    if (dz) {
      dz.classList.add('filled');
      dz.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-weight:900; background:#E0F2FE; color:#0284C7; padding:2px 8px; border-radius:6px;">${key}</span>
            <span style="font-weight:800; color:#0369A1;">${text}</span>
          </div>
          <button type="button" onclick="window.clearDropAnswer('${qId}', event)" style="background:#FEE2E2; color:#DC2626; border:none; border-radius:50%; width:22px; height:22px; font-weight:900; cursor:pointer;">&times;</button>
        </div>
      `;
    }
  };

  window.clearDropAnswer = function(qId, e) {
    if (e) e.stopPropagation();
    window.syncUserAnswer(qId, '');
    const dz = document.getElementById(`dropzone_${qId}`);
    if (dz) {
      dz.classList.remove('filled');
      dz.innerHTML = `<span style="color:#94A3B8; font-style:italic;">Kéo thả hoặc nhấp chọn đáp án vào đây</span>`;
    }
  };

  /* BUILD BÀI THI DUOLINGO 2 CỘT */
  window.buildListeningHtml = function(data, isPart4) {
    if (!data.groups || !data.questions) return data.questionHtml || "";
    let paperHtml = '';
    const allQIds = [];

    data.groups.forEach(group => {
      paperHtml += `<div class="section-title">${group.title}</div>`;
      if (group.instructions) {
        paperHtml += `<div class="instructions-box">${group.instructions}</div>`;
      }

      const isGapFillGroup = group.type === 'table' || group.type === 'notes' || group.tableHtml || (group.template && !group.options);
      const isMatchingDragDrop = (group.type === 'matching' || group.type === 'flowchart') && Array.isArray(group.options);
      const isMapGroup = group.type === 'map' || group.imageUrl;

      if (isMapGroup) {
        const optsLetters = ['A','B','C','D','E','F','G','H','I','J'].slice(0, group.optionsCount || 9);
        const imgPath = group.imageUrl || 'data-l/images/cam21-t2-p2-map.png';

        paperHtml += `
          <div style="margin: 18px 0;">
            <div style="background:#FFFFFF; border:2px solid var(--border-color); border-radius:16px; padding:12px; text-align:center; margin-bottom:14px;">
              <img src="${imgPath}" alt="Map" style="max-width:100%; height:auto; border-radius:10px;">
            </div>
            <table style="width:100%; border-collapse:collapse; background:#FFFFFF; border:2px solid var(--border-color); border-radius:16px; overflow:hidden;">
              <thead>
                <tr style="background:#FAF7F2;">
                  <th style="padding:10px 14px; text-align:left;">Câu hỏi</th>
                  ${optsLetters.map(l => `<th style="padding:10px 6px; text-align:center;">${l}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${group.questionIds.map(qId => {
                  allQIds.push(qId);
                  const q = data.questions[qId];
                  return `
                    <tr style="border-top:1px solid var(--border-color);" id="${qId}_row">
                      <td style="padding:10px 14px; font-weight:800;">
                        Câu ${q?.num || qId.replace('q','')}. ${q?.text || ''}
                        ${q?.time ? `<button type="button" class="btn-audio-pill" onclick="window.seekAudioTo(${q.time}, '${q.highlightId || ''}')">▶ Nghe</button>` : ''}
                        <button type="button" class="btn-comment-anchor" onclick="window.activateCommentBubble('${qId}')">Ghi chú</button>
                      </td>
                      ${optsLetters.map(letter => `
                        <td style="text-align:center; padding:6px;">
                          <input type="radio" name="${qId}" value="${letter}" onchange="window.syncUserAnswer('${qId}', '${letter}')" style="width:18px; height:18px; accent-color:#0284C7; cursor:pointer;">
                        </td>
                      `).join('')}

                }).join('')}
              </tbody>
            </table>
          </div>
        `;

      } else if (isMatchingDragDrop) {
        paperHtml += `<div style="margin:16px 0;">`;
        group.questionIds.forEach(qId => {
          allQIds.push(qId);
          const q = data.questions[qId];
          paperHtml += `
            <div style="background:#FAF7F2; border:2px solid var(--border-color); border-radius:14px; padding:14px; margin-bottom:12px;" id="${qId}_card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span style="font-weight:900; font-size:15px;">
                  Câu ${q?.num || qId.replace('q','')}. ${q?.stepTitle || q?.text || ''}
                  <button type="button" class="btn-comment-anchor" onclick="window.activateCommentBubble('${qId}')">Ghi chú</button>
                </span>
                ${q?.time ? `<button type="button" class="btn-audio-pill" onclick="window.seekAudioTo(${q.time}, '${q.highlightId || ''}')">▶ ${formatTime(q.time)}</button>` : ''}
              </div>
              <div id="dropzone_${qId}" class="dropzone-box" onclick="window.handleDropzoneClick('${qId}')" ondragover="window.handleDragOver(event)" ondragleave="window.handleDragLeave(event)" ondrop="window.handleDrop(event, '${qId}')" style="min-height:44px; border:2px dashed #94A3B8; border-radius:10px; background:#FFFFFF; display:flex; align-items:center; padding:6px 14px; cursor:pointer;">
                <span style="color:#94A3B8; font-style:italic;">Kéo thả hoặc nhấp chọn đáp án vào đây</span>
              </div>
              <div id="${qId}_feedback" style="display:none; margin-top:8px;"></div>
            </div>
          `;
        });

        paperHtml += `
          <div style="background:#FFFFFF; border:2px solid var(--border-color); border-radius:16px; padding:16px; margin-top:16px;">
            <b style="display:block; margin-bottom:10px; font-size:14px; color:var(--text-main);">Ngân hàng đáp án (Kéo thả hoặc Nhấp để chọn):</b>
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${group.options.map(opt => `
                <div class="matching-drag-card" draggable="true" ondragstart="window.handleDragStart(event, '${opt.key}', '${opt.text.replace(/'/g, "\\'")}')" onclick="window.selectOptionCard('${opt.key}', '${opt.text.replace(/'/g, "\\'")}', this)" style="background:#FAF7F2; border:1.5px solid var(--border-color); border-radius:10px; padding:10px 14px; cursor:pointer; display:flex; align-items:center; gap:10px; transition:all 0.1s ease;">
                  <span style="background:#0284C7; color:white; font-weight:900; padding:2px 8px; border-radius:6px;">${opt.key}</span>
                  <span style="font-weight:700;">${opt.text}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>`;

      } else if (isGapFillGroup) {
        let contentBody = group.tableHtml || group.template || '';
        group.questionIds.forEach(qId => {
          allQIds.push(qId);
          const q = data.questions[qId];
          const width = q?.inputWidth || "140px";
          const audioTimeStr = q?.time ? `<button type="button" class="btn-audio-pill" onclick="window.seekAudioTo(${q.time}, '${q.highlightId || ''}')">▶</button>` : '';

          const inputReplacement = `
            <span style="display:inline-block; vertical-align:middle; margin:3px 0;">
              <input type="text" class="fill-input" id="${qId}_input" style="width:${width};" placeholder="[Câu ${q?.num || qId}]" 
                     onfocus="window.activateCommentBubble('${qId}')"
                     oninput="window.syncUserAnswer('${qId}', this.value)">
              ${audioTimeStr}
              <button type="button" class="btn-comment-anchor" onclick="window.activateCommentBubble('${qId}')">Ghi chú</button>
              <div id="${qId}_feedback" style="display:none; font-size:12px; font-weight:800; padding:2px 6px; border-radius:4px; margin-top:2px;"></div>
            </span>
          `;
          contentBody = contentBody.replace(new RegExp(`{{${qId}}}`, 'g'), inputReplacement);
        });

        paperHtml += `<div style="margin-bottom:18px; font-size:15px; line-height:1.8;">${contentBody}</div>`;

      } else {
        group.questionIds.forEach(qId => {
          allQIds.push(qId);
          const q = data.questions[qId];
          if (!q) return;

          let optionsList = '';
          if (q.options && Array.isArray(q.options)) {
            optionsList = q.options.map(opt => {
              const letterMatch = opt.match(/^([A-Z])[\.\:\s]/i);
              const letter = letterMatch ? letterMatch[1].toUpperCase() : opt.charAt(0);
              const text = letterMatch ? opt.substring(letterMatch[0].length).trim() : opt;

              return `
                <label class="mcq-option-item" data-letter="${letter}" onclick="window.syncUserAnswer('${qId}', '${letter}'); window.activateCommentBubble('${qId}');">
                  <input type="radio" name="${qId}" value="${letter}" style="display:none;">
                  <span class="mcq-badge">${letter}</span>
                  <span style="font-size:14.5px; font-weight:700; color:var(--text-main); flex:1;">${text}</span>
                </label>
              `;
            }).join('');
          }

          paperHtml += `
            <div style="background:#FAF7F2; border:2px solid var(--border-color); border-radius:18px; padding:18px 20px; margin-top:14px;" id="${qId}_card" onclick="window.activateCommentBubble('${qId}')">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span style="font-size:16px; font-weight:900;">
                  Câu ${q.num || qId.replace('q','')}. ${q.text || ''}
                  <button type="button" class="btn-comment-anchor" onclick="window.activateCommentBubble('${qId}')">Ghi chú</button>
                </span>
                ${q.time ? `<button type="button" class="btn-audio-pill" onclick="window.seekAudioTo(${q.time}, '${q.highlightId || ''}')">▶ ${formatTime(q.time)}</button>` : ''}
              </div>
              <div class="mcq-options-list">${optionsList}</div>
              <div id="${qId}_feedback" style="display:none; margin-top:8px;"></div>
            </div>
          `;
        });
      }
    });

    paperHtml += `<button type="button" class="btn-submit" onclick="window.checkAnswers()">CHẤM BÀI PHẦN NÀY VÀ MỞ TRANSCRIPT &rarr;</button>`;

    if (isPart4) {
      paperHtml += `
        <button type="button" class="btn-full-submit" onclick="window.submitFullListeningTest()">
          NỘP TỔNG & TÍNH BAND SCORE CẢ 4 PARTS (40 CÂU) &rarr;
        </button>
      `;
    }

    const commentsListHtml = allQIds.map(qId => {
      const num = data.questions[qId]?.num || qId.replace('q','');
      return `
        <div class="gdocs-comment-bubble is-collapsed" id="bubble_${qId}" onclick="window.activateCommentBubble('${qId}')">
          <div class="gdocs-bubble-header" onclick="window.toggleSingleCommentBubble('${qId}', event)">
            <div>
              <span class="gdocs-bubble-badge">Câu ${num}</span>
              <span class="gdocs-bubble-preview" id="bubble_prev_${qId}"></span>
            </div>
            <span style="font-size:12px; font-weight:900; color:var(--text-muted);">▼</span>
          </div>
          <div class="gdocs-bubble-body">
            <div class="inline-thought-box">
              <label>Mạch suy nghĩ của em:</label>
              <textarea id="${qId}_thought" placeholder="Ghi chú suy nghĩ..." oninput="window.saveThought('${qId}', this.value)"></textarea>
            </div>
            <div class="ai-assistant-box">
              <label>Hỏi Trợ giảng AI:</label>
              <div class="ai-input-group">
                <input type="text" id="ai_ask_${qId}" placeholder="Hỏi AI về câu này..." oninput="window.saveAiDraft('${qId}', this.value)">
                <button type="button" class="ai-btn" onclick="window.askGeminiAI && window.askGeminiAI('${qId}')">Gửi</button>
              </div>
              <div class="ai-response" id="ai_response_${qId}"></div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="gdocs-exam-wrapper">
        <div class="gdocs-paper-col">
          ${paperHtml}
        </div>
        <div class="gdocs-comments-col">
          <div class="gdocs-comments-header">
            <span class="gdocs-header-title">Ghi chú & Trợ giảng AI</span>
            <div style="display:flex; gap:6px;">
              <button type="button" class="btn-gdocs-toggle-all" onclick="window.toggleAllCommentBubbles(true)">Mở hết</button>
              <button type="button" class="btn-gdocs-toggle-all" onclick="window.toggleAllCommentBubbles(false)">Thu gọn</button>
            </div>
          </div>
          <div class="gdocs-bubbles-container">
            ${commentsListHtml}
          </div>
        </div>

  };

  /* =========================================================================
     BỘ MÁY CHẤM BÀI THÔNG MINH & HIỂN THỊ KẾT QUẢ TRỰC QUAN DUOLINGO 3D
     (XỬ LÝ TOÀN DIỆN CẢ MULTI-SELECT CHOOSE TWO, SINGLE MCQ, MATCHING, GAPFILL)
     ========================================================================= */
  window.enableSplitViewAfterSubmit = function() {
    document.body.classList.add('submitted');
    const passageBox = document.getElementById('passageBox');
    const dragResizer = document.getElementById('dragResizer');
    const mainContainer = document.getElementById('mainContainer');

    if (passageBox) {
      passageBox.style.setProperty('display', 'block', 'important');
      if (!passageBox.style.width) passageBox.style.width = '48%';
    }
    if (dragResizer) dragResizer.style.setProperty('display', 'flex', 'important');
    if (mainContainer) {
      mainContainer.style.setProperty('display', 'flex', 'important');
      mainContainer.style.setProperty('flex-direction', 'row', 'important');
      mainContainer.style.setProperty('height', 'calc(100vh - 130px)', 'important');
    }

    if (!window.TEST_DATA || !window.TEST_DATA.answers) return;

    let totalScore = 0;
    const questionsMap = window.TEST_DATA.questions || {};
    const answersMap = window.TEST_DATA.answers;
    const allQKeys = Object.keys(answersMap);

    // 1. Phân nhóm các câu hỏi "Choose TWO" (có official dạng mảng chung)
    const pairedGroups = {};
    allQKeys.forEach(k => {
      const val = answersMap[k];
      if (Array.isArray(val) && val.length > 1) {
        const sortedKey = [...val].sort().join(',');
        if (!pairedGroups[sortedKey]) pairedGroups[sortedKey] = [];
        pairedGroups[sortedKey].push(k);
      }
    });

    const evaluatedPairs = new Set();
    const qResults = {}; // { qId: { isCorrect, userAns, expectedAns, feedbackText } }

    // Đọc câu trả lời của học sinh từ localStorage
    let storedAnswers = {};
    if (window.CURRENT_BASE_TEST) {
      try {
        storedAnswers = JSON.parse(localStorage.getItem(`ielts_ans_${window.CURRENT_BASE_TEST}`) || '{}');
      } catch(e) {}
    }

    // 2. Chấm các cặp câu "Choose TWO letters" (ví dụ Q21-22, Q23-24 Cam 20)
    Object.entries(pairedGroups).forEach(([groupKey, qIdList]) => {
      const officialSet = groupKey.split(','); // ['C', 'E']
      const usedCorrectAnswers = new Set();

      qIdList.forEach(qId => {
        evaluatedPairs.add(qId);
        const radioChecked = document.querySelector(`input[name="${qId}"]:checked`);
        const userChoice = (radioChecked ? radioChecked.value : (storedAnswers[qId] || '')).trim().toUpperCase();

        if (userChoice && officialSet.includes(userChoice) && !usedCorrectAnswers.has(userChoice)) {
          usedCorrectAnswers.add(userChoice);
          qResults[qId] = {
            isCorrect: true,
            userAns: userChoice,
            expectedAns: officialSet.join(' / '),
            feedbackText: `✓ Đúng! (Đáp án trong nhóm: ${officialSet.join(', ')})`
          };
          totalScore++;
        } else if (usedCorrectAnswers.has(userChoice)) {
          qResults[qId] = {
            isCorrect: false,
            userAns: userChoice,
            expectedAns: officialSet.join(' / '),
            feedbackText: `✗ Sai do chọn trùng đáp án ${userChoice} với câu khác trong nhóm!`
          };
        } else {
          qResults[qId] = {
            isCorrect: false,
            userAns: userChoice || 'Chưa làm',
            expectedAns: officialSet.join(' / '),
            feedbackText: `✗ Sai! Đáp án thuộc nhóm: <b>${officialSet.join(' / ')}</b>`
          };
        }
      });
    });

    // 3. Chấm các câu hỏi độc lập (Single MCQ, Matching, Gap-fill, Map)
    allQKeys.forEach(qId => {
      if (evaluatedPairs.has(qId)) return; // Đã chấm ở phần paired

      const official = answersMap[qId];
      const qMeta = questionsMap[qId] || {};

      // A. Điền từ (Gap-fill)
      const inp = document.getElementById(`${qId}_input`);
      if (inp) {
        const userVal = inp.value.trim().toLowerCase();
        let isCorrect = Array.isArray(official) ? official.some(a => a.toLowerCase() === userVal) : (String(official).trim().toLowerCase() === userVal);
        const expStr = Array.isArray(official) ? official.join(' / ') : official;
        if (isCorrect) {
          totalScore++;
          qResults[qId] = { isCorrect: true, userAns: userVal, expectedAns: expStr, feedbackText: `✓ Đúng!` };
        } else {
          qResults[qId] = { isCorrect: false, userAns: userVal || 'Chưa làm', expectedAns: expStr, feedbackText: `✗ Sai! Đáp án: <b>${expStr}</b>` };
        }
        return;
      }

      // B. Kéo thả (Matching / Flowchart)
      const dropzone = document.getElementById(`dropzone_${qId}`);
      if (dropzone) {
        const userChoice = (storedAnswers[qId] || '').trim().toUpperCase();
        const expStr = String(official).trim().toUpperCase();
        let isCorrect = userChoice === expStr;
        if (isCorrect) {
          totalScore++;
          qResults[qId] = { isCorrect: true, userAns: userChoice, expectedAns: expStr, feedbackText: `✓ Đúng!` };
        } else {
          qResults[qId] = { isCorrect: false, userAns: userChoice || 'Chưa làm', expectedAns: expStr, feedbackText: `✗ Sai! Đáp án đúng: <b>${expStr}</b>` };
        }
        return;
      }

      // C. Trắc nghiệm (Single MCQ) & Map Radio
      const radioChecked = document.querySelector(`input[name="${qId}"]:checked`);
      const userChoice = (radioChecked ? radioChecked.value : (storedAnswers[qId] || '')).trim().toUpperCase();
      const expStr = String(official).trim().toUpperCase();
      let isCorrect = userChoice === expStr;

      if (isCorrect) {
        totalScore++;
        qResults[qId] = { isCorrect: true, userAns: userChoice, expectedAns: expStr, feedbackText: `✓ Đúng!` };
      } else {
        qResults[qId] = { isCorrect: false, userAns: userChoice || 'Chưa làm', expectedAns: expStr, feedbackText: `✗ Sai! Đáp án: <b>${expStr}</b>` };
      }
    });

    // 4. HIỂN THỊ TRỰC QUAN KẾT QUẢ ĐÚNG / SAI LÊN TỪNG THẺ CÂU HỎI
    allQKeys.forEach(qId => {
      const res = qResults[qId];
      if (!res) return;

      const qMeta = questionsMap[qId] || {};
      const expStr = res.expectedAns;
      const feedbackEl = document.getElementById(`${qId}_feedback`);

      // Cập nhật ô Điền từ
      const inp = document.getElementById(`${qId}_input`);
      if (inp) {
        inp.style.borderColor = res.isCorrect ? '#22C55E' : '#EF4444';
        inp.style.backgroundColor = res.isCorrect ? '#F0FDF4' : '#FFF5F5';
      }

      // Cập nhật ô Matching Dropzone
      const dropzone = document.getElementById(`dropzone_${qId}`);
      if (dropzone) {
        dropzone.classList.remove('is-correct', 'is-wrong');
        dropzone.classList.add(res.isCorrect ? 'is-correct' : 'is-wrong');
      }

      // Cập nhật các lựa chọn MCQ
      const cardEl = document.getElementById(`${qId}_card`);
      if (cardEl) {
        const optionLabels = cardEl.querySelectorAll('.mcq-option-item');
        optionLabels.forEach(lbl => {
          const letter = (lbl.dataset.letter || lbl.querySelector('.mcq-badge')?.innerText || '').trim().toUpperCase();
          lbl.classList.remove('is-user-correct', 'is-user-wrong', 'is-official-key');

          if (letter === res.userAns && res.isCorrect) {
            lbl.classList.add('is-user-correct');
          } else if (letter === res.userAns && !res.isCorrect) {
            lbl.classList.add('is-user-wrong');
          }
          
          // Đánh dấu viền đáp án chính xác
          if (expStr.split(/[\/,]/).map(s => s.trim().toUpperCase()).includes(letter)) {
            lbl.classList.add('is-official-key');
          }
        });
      }

      // Cập nhật ô Map Table Row
      const mapRow = document.getElementById(`${qId}_row`);
      if (mapRow) {
        mapRow.style.backgroundColor = res.isCorrect ? '#F0FDF4' : '#FFF5F5';
      }

      // Hiển thị phản hồi & Giải thích (Explanation)
      if (feedbackEl) {
        feedbackEl.style.display = 'block';
        let explainHtml = '';
        if (qMeta.explanation && qMeta.explanation.steps) {
          explainHtml = `
            <div class="q-explanation-box">
              <b style="color:#0369A1; font-size:13px; display:block; margin-bottom:4px;">💡 Giải thích chi tiết:</b>
              ${qMeta.explanation.steps.map(s => `<div style="margin-bottom:3px;">${s}</div>`).join('')}
            </div>
          `;
        }
        feedbackEl.innerHTML = `
          <div style="font-weight:900; font-size:13.5px; color:${res.isCorrect ? '#166534' : '#DC2626'}; margin-bottom:4px;">
            ${res.feedbackText}
          </div>
          ${explainHtml}
        `;
      }

      // Cập nhật số câu ở thanh điều hướng đáy [21] [22]...
      const badgeBtn = document.getElementById(`badge_${qId}`);
      if (badgeBtn) {
        badgeBtn.classList.remove('status-correct', 'status-incorrect');
        badgeBtn.classList.add(res.isCorrect ? 'status-correct' : 'status-incorrect');
      }
    });

    // 5. Cập nhật bảng điểm và huy hiệu thành tích
    const scoreText = document.getElementById('scoreText');
    const scoreBadge = document.getElementById('scoreBadge');
    if (scoreText) scoreText.innerText = `${totalScore}/${allQKeys.length}`;
    if (scoreBadge) scoreBadge.style.display = 'block';

    const questionBox = document.getElementById('questionBox');
    if (questionBox && !document.getElementById('submitSuccessBanner')) {
      const banner = document.createElement('div');
      banner.id = 'submitSuccessBanner';
      banner.style.cssText = 'background:#F0FDF4; border:2px solid #86EFAC; border-bottom:4px solid #22C55E; border-radius:16px; padding:16px 20px; margin-bottom:20px; color:#166534; font-size:14.5px; font-weight:800;';
      banner.innerHTML = `
        <div style="font-size:17px; margin-bottom:4px;">🎉 ĐÃ CHẤM XONG! KẾT QUẢ ĐẠT ĐƯỢC: ${totalScore}/${allQKeys.length} CÂU ĐÚNG</div>
        <span>Transcript đối chiếu đã mở ở cột bên trái. Em có thể giữ chuột vào thanh ◄► để kéo rộng màn hình xem lại nhé!</span>
      `;
      questionBox.insertBefore(banner, questionBox.firstChild);
      questionBox.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };

  window.highlightText = function(hlId) {
    const el = document.getElementById(hlId);
    const passageBox = document.getElementById('passageBox');
    if (el && passageBox) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.backgroundColor = '#FEF08A';
      el.style.outline = '2px solid #EAB308';
      setTimeout(() => {
        el.style.backgroundColor = '';
        el.style.outline = '';
      }, 2200);
    }
  };
</script>

<script type="module">
  import { initListeningApp } from './js-l/app-l.js';
  import { initListeningNavigation } from './js-l/listening-nav.js';

  const params = new URLSearchParams(window.location.search);
  let testId = params.get('test');

  if (!testId) {
    alert("⚠️ Không tìm thấy mã đề thi!");
    window.location.href = 'listening.html';
  } else {
    async function loadTest() {
      const raw = testId.replace(/\.json$/i, '');
      const fileName = raw.includes('/') ? raw.split('/').pop() : raw;
      const folderName = fileName.replace(/-p\d+.*$/i, '');

      window.CURRENT_BASE_TEST = folderName;
      const isPart4 = fileName.toLowerCase().endsWith('-p4') || fileName.toLowerCase().includes('-p4');

      const urlsToTry = [
        `data-l/${folderName}/${fileName}.json`,
        `data-l/${fileName}.json`,
        `${fileName}.json`,
        `data-l/${raw}.json`,
        `${raw}.json`,
        `../data/${folderName}/${fileName}.json`
      ];

      let data = null;
      for (const url of urlsToTry) {
        try {
          const res = await fetch(`${url}?t=${Date.now()}`, { cache: 'no-store' });
          if (res.ok) {
            data = await res.json();
            break;
          }
        } catch (e) {}
      }

      if (!data) {
        document.getElementById('mainContainer').innerHTML = `
          <div style="padding: 40px; text-align: center; width: 100%; background:#FFFFFF; border-radius:20px; border:2px solid var(--border-color);">
            <h3 style="color: #DC2626; font-size:18px;">❌ Không tìm thấy file đề: <code>${fileName}.json</code></h3>
            <p style="color: var(--text-muted); font-size:14px;">Hãy kiểm tra lại xem file đã được đặt vào thư mục <code>listening/data-l/</code> chưa.</p>
            <a href="listening.html" style="color:#0284C7; font-weight:800;">← Quay về danh mục nghe</a>
          </div>
        `;
        return;
      }

      document.title = data.title;
      document.getElementById('testTitleHeader').innerText = data.title;
      document.getElementById('passageBox').innerHTML = data.transcriptHtml || data.passageHtml || "";

      setTimeout(() => {
        document.querySelectorAll('.transcript-line[data-time]').forEach(el => {
          el.style.cursor = 'pointer';
          el.title = 'Bấm để nghe từ đoạn này';
          el.addEventListener('click', () => {
            const time = el.getAttribute('data-time');
            if (time) window.seekAudioTo(time);
          });
        });
      }, 300);

      document.getElementById('questionBox').innerHTML = window.buildListeningHtml(data, isPart4);
      
      if (data.audioUrl) {
        const audioEl = document.getElementById('mainAudioElement');
        const wrapper = document.getElementById('audioPlayerWrapper');
        if (audioEl && wrapper) {
          audioEl.src = data.audioUrl;
          wrapper.style.display = 'block';
        }
      }

      window.TEST_DATA = { 
        title: data.title, 
        questions: data.questions || {},
        answers: data.answers || (data.questions ? Object.fromEntries(Object.entries(data.questions).map(([k, v]) => [k, v.finalAnswer])) : {})
      };

      await initListeningApp();
      window.restoreSavedUserData();
      setupAiObserver();

      const realCheckAnswers = window.checkAnswers;
      window.checkAnswers = function() {
        if (typeof realCheckAnswers === 'function') realCheckAnswers();
        if (window.enableSplitViewAfterSubmit) window.enableSplitViewAfterSubmit();
      };
      
      initListeningNavigation();
    }

    loadTest();
  }
</script>
</body>
</html>
