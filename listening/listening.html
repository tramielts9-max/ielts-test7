<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Listening Practice - Cambridge & Vol Actual Tests</title>
  
  <!-- Font Plus Jakarta Sans chuẩn Duolingo, hỗ trợ tiếng Việt 100% -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="css-l/listening.css">

  <style>
    /* CSS RIÊNG CHO TRANG DANH MỤC LISTENING CATALOG */
    .listening-hero {
      background: linear-gradient(135deg, #0284C7 0%, #38BDF8 100%);
      color: #FFFFFF;
      padding: 24px 28px;
      border-radius: 22px;
      margin-bottom: 24px;
      border: 2.5px solid #0369A1;
      border-bottom: 5.5px solid #075985;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.2);
    }
    .listening-hero h1 {
      margin: 0 0 6px 0;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }
    .listening-hero p {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      opacity: 0.95;
    }

    .top-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .series-tabs-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 26px;
    }

    .tabs-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      background: #FFFFFF;
      padding: 12px 18px;
      border-radius: 20px;
      border: 2.5px solid #E8E2D8;
      border-bottom: 5px solid #D3CBC0;
    }
    .tab-label {
      font-weight: 900;
      font-size: 14px;
      margin-right: 6px;
      min-width: 140px;
      letter-spacing: 0.3px;
    }

    .tab-btn {
      background: #FAF7F2;
      border: 2px solid #E8E2D8;
      border-bottom: 4px solid #D3CBC0;
      color: #261F1D;
      padding: 8px 18px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.08s ease;
    }
    .tab-btn:hover { background: #FFFFFF; }
    .tab-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

    .tab-btn.active-cam {
      background: #0284C7 !important;
      border-color: #0369A1 !important;
      border-bottom: 4px solid #075985 !important;
      color: #FFFFFF !important;
    }
    .tab-btn.active-vol {
      background: #0D9488 !important;
      border-color: #0F766E !important;
      border-bottom: 4px solid #115E59 !important;
      color: #FFFFFF !important;
    }

    .test-heading {
      font-size: 18px;
      font-weight: 900;
      color: #261F1D;
      margin: 28px 0 14px 0;
      padding-bottom: 8px;
      border-bottom: 3px solid #0284C7;
    }
    .test-heading.vol-heading {
      border-bottom-color: #0D9488;
    }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .test-card {
      background: #FFFFFF;
      border: 2.5px solid #E8E2D8;
      border-bottom: 5.5px solid #D3CBC0;
      border-radius: 20px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
      transition: transform 0.1s ease;
    }
    .test-card:hover { transform: translateY(-2px); }

    .test-card.is-completed {
      border-color: #86EFAC !important;
      border-bottom-color: #22C55E !important;
      background: #F0FDF4 !important;
    }

    .badge-lis {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 900;
      background: #E0F2FE;
      color: #0284C7;
      border: 1.5px solid #BAE6FD;
      margin-bottom: 8px;
    }
    .badge-lis.badge-vol {
      background: #CCFBF1;
      color: #0F766E;
      border-color: #99F6E4;
    }
    .badge-done {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 900;
      background: #DCFCE7;
      color: #15803D;
      border: 1.5px solid #86EFAC;
    }

    .card-title {
      color: #0284C7;
      font-size: 16px;
      font-weight: 900;
      margin: 0 0 6px 0;
      line-height: 1.4;
    }
    .card-title.vol-title { color: #0D9488; }
    .card-desc {
      font-size: 13.5px;
      font-weight: 700;
      color: #756D68;
      margin: 0 0 16px 0;
      line-height: 1.45;
    }

    .btn-play {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #0284C7;
      color: #FFFFFF !important;
      border: none;
      border-bottom: 4.5px solid #075985;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      transition: all 0.08s ease;
    }
    .btn-play:hover { background: #0369A1; }
    .btn-play:active { transform: translateY(2px); border-bottom-width: 2px; }

    .btn-play.btn-vol {
      background: #0D9488;
      border-bottom-color: #115E59;
    }
    .btn-play.btn-vol:hover { background: #0F766E; }

    .btn-play.btn-done {
      background: #22C55E !important;
      border-bottom-color: #15803D !important;
    }
    .btn-play.btn-done:hover { background: #16A34A !important; }
  </style>
</head>
<body>

<div class="container-lis">
  <div class="listening-hero">
    <h1>PHÒNG LUYỆN THI IELTS LISTENING</h1>
    <p>Trọn bộ Cambridge 17-21 & IELTS Recent Actual Tests (Vol 1 - 8) • Audio đồng bộ Transcript</p>
  </div>

  <div class="top-nav-bar">
    <a href="../index.html" class="btn-3d btn-3d-white" style="padding: 10px 18px; font-size: 14px;">
      ← Về Cổng Thi Chính
    </a>
    <span id="userStatusTag" style="font-size: 13.5px; color: var(--text-muted); font-weight: 800;"></span>
  </div>

  <div class="series-tabs-container">
    <div class="tabs-bar">
      <span class="tab-label" style="color: #0284C7;">Cambridge IELTS:</span>
      <button type="button" class="tab-btn active-cam" data-series="cam" data-val="21" onclick="switchSeries('cam', 21)">Cam 21</button>
      <button type="button" class="tab-btn" data-series="cam" data-val="20" onclick="switchSeries('cam', 20)">Cam 20</button>
      <button type="button" class="tab-btn" data-series="cam" data-val="19" onclick="switchSeries('cam', 19)">Cam 19</button>
      <button type="button" class="tab-btn" data-series="cam" data-val="18" onclick="switchSeries('cam', 18)">Cam 18</button>
      <button type="button" class="tab-btn" data-series="cam" data-val="17" onclick="switchSeries('cam', 17)">Cam 17</button>
    </div>

    <div class="tabs-bar">
      <span class="tab-label" style="color: #0D9488;">Đề Vol (1 - 8):</span>
      <button type="button" class="tab-btn" data-series="vol" data-val="8" onclick="switchSeries('vol', 8)">Vol 8</button>
      <button type="button" class="tab-btn" data-series="vol" data-val="7" onclick="switchSeries('vol', 7)">Vol 7</button>
      <button type="button" class="tab-btn" data-series="vol" data-val="6" onclick="switchSeries('vol', 6)">Vol 6</button>
      <button type="button" class="tab-btn" data-series="vol" data-val="5" onclick="switchSeries('vol', 5)">Vol 5</button>
      <button type="button" class="tab-btn" data-series="vol" data-val="4" onclick="switchSeries('vol', 4)">Vol 4</button>
      <button type="button" class="tab-btn" data-series="vol" data-val="3" onclick="switchSeries('vol', 3)">Vol 3</button>
      <button type="button" class="tab-btn" data-series="vol" data-val="2" onclick="switchSeries('vol', 2)">Vol 2</button>
      <button type="button" class="tab-btn" data-series="vol" data-val="1" onclick="switchSeries('vol', 1)">Vol 1</button>
    </div>
  </div>

  <div id="listeningCatalogContainer">
    <div style="text-align: center; padding: 40px; color: var(--text-muted); font-weight: 800; font-size: 15px;">
      ⏳ Đang tải dữ liệu bài thi Listening...
    </div>
  </div>
</div>

<script type="module">
  import { stateManager } from '../js/state.js';
  import { renderTagsHtml } from '../js/taxonomy-registry.js';

  let listeningData = [];
  let currentSeries = 'cam';
  let currentVal = 21;

  try {
    const user = stateManager.getUser();
    if (user && user.email) {
      document.getElementById('userStatusTag').innerText = `Học viên: ${user.name || user.email}`;
    }
  } catch(e) {}

  function getCompletedRecord(keyString, titleString) {
    try {
      const list = JSON.parse(localStorage.getItem('ielts_local_history') || '[]');
      return list.find(item => {
        const matchUrl = item.pageUrl && keyString && item.pageUrl.includes(keyString);
        const matchTitle = item.testTitle && titleString && item.testTitle.toLowerCase().includes(titleString.toLowerCase());
        return matchUrl || matchTitle;
      });
    } catch(e) {
      return null;
    }
  }

  async function loadCatalog() {
    try {
      const res = await fetch(`data-l/listening-catalog.json?t=${Date.now()}`);
      if (res.ok) {
        listeningData = await res.json();
      }
    } catch (e) {
      console.warn("Chưa tải được listening-catalog.json từ data-l/");
    }
    renderUI();
  }

  window.switchSeries = (series, val) => {
    currentSeries = series;
    currentVal = val;

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.remove('active-cam', 'active-vol');
      if (btn.dataset.series === series && parseInt(btn.dataset.val) === val) {
        btn.classList.add(series === 'cam' ? 'active-cam' : 'active-vol');
      }
    });

    renderUI();
  };

  function renderUI() {
    const container = document.getElementById('listeningCatalogContainer');
    let html = '';

    if (currentSeries === 'cam') {
      const item = listeningData.find(d => d.cam === currentVal);
      if (!item || !item.tests) {
        container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted); font-weight: 800;">Đang chuẩn bị dữ liệu cho Cambridge ${currentVal}...</div>`;
        return;
      }

      item.tests.forEach(test => {
        html += `
          <div class="test-heading">
            Cambridge IELTS ${item.cam} - Listening Test ${test.testNum}
          </div>
          <div class="test-grid">
        `;
        test.parts.forEach(part => {
          const standardId = `LIS_CAM${item.cam}_T${test.testNum}_P${part.p}`;
          const tagsHtml = renderTagsHtml(standardId);
          const fileKey = part.file ? part.file.replace('.json', '') : `cam${item.cam}-lis-test${test.testNum}-p${part.p}`;
          const testUrl = `runner-listening.html?test=${part.file}`;

          const rec = getCompletedRecord(fileKey, part.title);
          const isDone = !!rec;

          html += `
            <div class="test-card ${isDone ? 'is-completed' : ''}">
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                  <span class="badge-lis">Part ${part.p}</span>
                  ${isDone ? `<span class="badge-done">✓ Đã nộp (${rec.score})</span>` : ''}
                </div>
                <h4 class="card-title">${part.title}</h4>
                ${tagsHtml}
                <div class="card-desc">${part.desc}</div>
              </div>
              <a href="${testUrl}" class="btn-play ${isDone ? 'btn-done' : ''}">
                ${isDone ? '✓ Nghe Lại / Làm Lại' : 'Nghe & Làm Bài →'}
              </a>
            </div>
          `;
        });
        html += `</div>`;
      });
    } else if (currentSeries === 'vol') {
      const volNum = currentVal;
      for (let t = 1; t <= 10; t++) {
        html += `
          <div class="test-heading vol-heading">
            Vol ${volNum} Test ${t} - Listening
          </div>
          <div class="test-grid">
        `;
        for (let p = 1; p <= 4; p++) {
          const standardId = `LIS_VOL${volNum}_T${t}_P${p}`;
          const tagsHtml = renderTagsHtml(standardId);
          const fileKey = `vol${volNum}-lis-test${t}-p${p}`;
          const testUrl = `runner-listening.html?test=${fileKey}`;

          const rec = getCompletedRecord(fileKey, `Vol ${volNum} Test ${t} - Part ${p}`);
          const isDone = !!rec;

          html += `
            <div class="test-card ${isDone ? 'is-completed' : ''}">
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                  <span class="badge-lis badge-vol">Part ${p}</span>
                  ${isDone ? `<span class="badge-done">✓ Đã nộp (${rec.score})</span>` : ''}
                </div>
                <h4 class="card-title vol-title">Vol ${volNum} Test ${t} - Part ${p}</h4>
                ${tagsHtml}
                <div class="card-desc">IELTS Listening Practice Part ${p}</div>
              </div>
              <a href="${testUrl}" class="btn-play ${isDone ? 'btn-done' : 'btn-vol'}">
                ${isDone ? '✓ Nghe Lại / Làm Lại' : `Vào Nghe Part ${p} →`}
              </a>
            </div>
          `;
        }
        html += `</div>`;
      }
    }

    container.innerHTML = html;
  }

  loadCatalog();
</script>
</body>
</html>
